<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="yukitora-header">
    <div class="header-inner">
      <img src="icons/koya.png" alt="小屋" class="icon-koya">

      <h1 class="site-title">ユキトラの庭</h1>

      <img src="icons/yukitora_front.png" alt="ユキトラ" class="icon-yukitora">
    </div>

    <div class="grass"></div>
  </header>

  <main>
    <section class="game-list">

      <div class="game-card">
        <img src="thumbs/game1.png" class="game-thumb" alt="">
        <h2 class="game-title">
          <a href="games/circle shot/index.html" class="game-link">ゲームタイトル1</a>
        </h2>
        <p class="game-desc">ゆるく遊べるミニゲームです。</p>
      </div>

      <div class="game-card">
        <img src="thumbs/game2.png" class="game-thumb" alt="">
        <h2 class="game-title">
          <a href="games/game2/index.html" class="game-link">ゲームタイトル2</a>
        </h2>
        <p class="game-desc">反射神経を試すゲームです。</p>
      </div>

      <div class="game-card">
        <img src="thumbs/game3.png" class="game-thumb" alt="">
        <h2 class="game-title">
          <a href="games/game3/index.html" class="game-link">ゲームタイトル3</a>
        </h2>
        <p class="game-desc">頭を使うパズルゲームです。</p>
      </div>

    </section>
  </main>

  <script type="module" src="src/main.js?v=202604026"></script>
</body>
</html>
