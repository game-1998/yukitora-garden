<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サークルショット</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="gameWrapper">
    <!-- タイトル画面 -->
    <div id="titleScreen">
      <!-- 決め打ち星（固定配置） -->
      <div class="title-stars">
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>
        <div class="star s5"></div>
        <div class="star s6"></div>
        <div class="star s7"></div>
        <div class="star s8"></div>
        <div class="star s9"></div>
        <div class="star s10"></div>
      </div>

      <h1>サークルショット</h1>
      <button id="startButton">ゲーム開始</button>
      <button id="howToButton">遊び方</button>
    </div>

    <!-- 遊び方画面（モーダル） -->
    <div id="howToScreen" style="display:none;">
      <h2>遊び方</h2>
      <p>・ドラッグ／マウスで自機を操作します</p>
      <p>・敵の弾を避けながら撃破してスコアを伸ばします</p>
      <p>・ゲーム画面に切り替わったらタップでゲーム開始</p>
      <button id="backToTitle">戻る</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameScreen" style="display:none;">
      <canvas id="gameCanvas" width="480" height="720"></canvas>
      <p id="tapToStartText">タップでゲーム開始</p>

      <div id="gameOverOverlay" class="go-overlay">

        <!-- 決め打ち星（固定配置） -->
        <div class="go-stars">
          <div class="star s1"></div>
          <div class="star s2"></div>
          <div class="star s3"></div>
          <div class="star s4"></div>
          <div class="star s5"></div>
          <div class="star s6"></div>
          <div class="star s7"></div>
          <div class="star s8"></div>
          <div class="star s9"></div>
          <div class="star s10"></div>
        </div>

        <!-- 星型フレーム（GAME OVER） -->
        <div class="go-frame zoom-in">
          <div class="go-title">GAME OVER</div>

          <div class="go-score zoom-in">
            <span id="finalScore">0</span>
          </div>

          <!-- 撃破数 -->
          <div class="go-details">
            <div class="go-row">
              <span class="go-icon small"></span>
              <span class="go-x">×</span>
              <span id="killSmall"></span>
            </div>

            <div class="go-row">
              <span class="go-icon medium"></span>
              <span class="go-x">×</span>
              <span id="killMedium"></span>
            </div>

            <div class="go-row">
              <span class="go-icon large"></span>
              <span class="go-x">×</span>
              <span id="killLarge"></span>
            </div>

            <div class="go-row">
              <span class="go-icon boss"></span>
              <span class="go-x">×</span>
              <span id="killBoss"></span>
            </div>
          </div>

          <div class="go-buttons">
            <button class="go-btn" id="retryBtn">もう一度プレイ</button>
            <button class="go-btn" id="rankingBtn">ランキングを見る</button>
          </div>

          <!-- ランキング登録（100位以内のときだけ表示） -->
          <div id="nameEntry" class="name-entry hidden">
            <p class="entry-title">あなたのスコアは100位以内です！</p>
            <input id="playerNameInput" type="text" maxlength="12" placeholder="名前を入力">
            <button class="go-btn" id="submitNameBtn">登録する</button>
          </div>

        </div>
      </div>

    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

  <script type="module" src="src/main.js?v=202604026"></script>
</body>
</html>
